[tool.poetry]
name = "kronic"
version = "0.1.0"
description = "Read-only fork of mshade/kronic — Flask UI for Kubernetes CronJobs"
authors = ["kkretz"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
Flask = "^3.0"
Flask-Caching = "^2.3"
