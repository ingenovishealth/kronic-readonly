[tool.poetry]
name = "kronic"
version = "0.1.0"
description = "Read-only fork of mshade/kronic — Flask UI for Kubernetes CronJobs"
authors = ["kkretz"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
blinker = "1.8.2"
boltons = "24.0.0"
cachetools = "5.3.3"
certifi = "2024.7.4"
charset-normalizer = "3.3.2"
click = "8.1.7"
Flask = "3.0.3"
Flask-Caching = "2.3.0"
Flask-HTTPAuth = "4.8.0"
google-auth = "2.30.0"
gunicorn = "23.0.0"
idna = "3.7"
itsdangerous = "2.2.0"
Jinja2 = "3.1.6"
kubernetes = "30.1.0"
MarkupSafe = "2.1.5"
oauthlib = "3.2.2"
packaging = "24.1"
pyasn1 = "0.6.4"
pyasn1-modules = "0.4.0"
python-dateutil = "2.9.0.post0"
PyYAML = "6.0.1"
requests = "2.32.3"
requests-oauthlib = "2.0.0"
rsa = "4.9"
six = "1.16.0"
urllib3 = "2.7.0"
websocket-client = "1.8.0"
Werkzeug = "3.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
black = "24.4.2"
